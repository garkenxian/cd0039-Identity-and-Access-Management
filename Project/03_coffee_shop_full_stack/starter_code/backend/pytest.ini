[pytest]
# Pytest configuration for backend tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Base options (always applied)
addopts = -v

# Coverage options are applied via:
# 1. pytest.ini coverage section below
# 2. View with: pytest tests/ --cov=src --cov-report=html
# 3. Or use: make test-backend-coverage

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    src/database/seed.py
    */seed.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
